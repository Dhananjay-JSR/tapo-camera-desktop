[package]
name = "tapo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform desktop client for TP-Link Tapo cameras (live view, PTZ, playback, talk-back, alerts)."

[dependencies]
tapo-core = { path = "../tapo-core" }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
directories = "5.0.1"
cpal = "0.15.3"
openh264 = "0.9.9"

[features]
# Experimental macOS hardware decode (VideoToolbox); falls back to openh264 if it fails.
hw-videotoolbox = []  # scaffolded; FFI completed on-device (see src/decode_vt.rs)
