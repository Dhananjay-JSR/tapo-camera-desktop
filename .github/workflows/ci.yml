name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI + audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb1-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: macOS hardware-decode feature compiles
        if: runner.os == 'macOS'
        run: cargo build -p tapo-desktop --features hw-videotoolbox
